<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  {% set page_title = self.title() %}
  <title>{% block title %}{{ site.name }} — Backend & AI/ML Engineer{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}" />
  <meta name="author" content="{{ site.name }}" />
  <meta name="theme-color" content="#16120c" />
  <link rel="canonical" href="{{ site_url }}{{ request.url.path }}" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ site.name }}" />
  <meta property="og:title" content="{{ page_title }}" />
  <meta property="og:description" content="{{ self.description() }}" />
  <meta property="og:url" content="{{ site_url }}{{ request.url.path }}" />
  <meta property="og:image" content="{{ site_url }}/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page_title }}" />
  <meta name="twitter:description" content="{{ self.description() }}" />
  <meta name="twitter:image" content="{{ site_url }}/og.png" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127918;</text></svg>" />
  <script>
    (function () {
      var r = document.documentElement;
      r.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") r.setAttribute("data-theme", t);
        if (localStorage.getItem("view") === "text") r.classList.add("text");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="/static/js/app.js"></script>
  <script defer src="/static/js/rpg.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">pradyumna<span class="accent">.dev</span></a>
    <nav>
      <a href="/dashboard">stats</a>
      <a href="/workshop">workshop</a>
      <a href="{{ site.links['GitHub'] }}" target="_blank" rel="noopener">github</a>
      <button id="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span>© {{ site.name }}</span>
    <span class="mono">FastAPI · hand-written tile engine · <a href="/api">API</a></span>
  </footer>
</body>
</html>
