# Render Blueprint. In the Render dashboard: New → Blueprint → point at this repo.
# The database is external (Neon free tier) — set DATABASE_URL on both services.
services:
  - type: web
    name: pradyumna-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: SITE_URL
        sync: false   # your live URL: the *.onrender.com one, then pradyumnaprasad.dev
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string in the dashboard
      - key: GEMINI_API_KEY
        sync: false   # optional — enables the "ask my portfolio" chatbot + semantic search

  - type: cron
    name: portfolio-github-etl
    runtime: python
    plan: free
    schedule: "17 3 * * *"   # 03:17 UTC daily — refreshes the Observatory dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.etl
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false            # same Neon string as the web service
      - key: GITHUB_USERNAME
        value: PradyumnaPrasad
      - key: LEETCODE_USERNAME
        value: Pradyumna_Prasad
      - key: GITHUB_TOKEN
        sync: false            # optional — unlocks the GitHub contribution calendar
