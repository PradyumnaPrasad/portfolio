[project]
name = "pradyumna-portfolio"
version = "0.1.0"
description = "Backend + AI/ML portfolio of Pradyumna Prasad — a live FastAPI application."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]   # FastAPI Depends() in defaults is the intended pattern
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
