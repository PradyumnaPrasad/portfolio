[project]
name = "pradyumna-portfolio"
version = "0.1.0"
description = "Backend + AI/ML portfolio of Pradyumna Prasad — a live FastAPI application."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
